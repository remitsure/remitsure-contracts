[workspace]
resolver = "3"
members = [
  "contracts/*",
]

[workspace.package]
edition = "2021"
rust-version = "1.84"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "28"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# See https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
